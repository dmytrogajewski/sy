# sy-plugin-md — markdown previewer canary (SPEC §3.3 item 18).
#
# This manifest is the in-crate copy: the absolute `exec` path is
# substituted at install/test time. The productivised twin lives at
# `configs/sy/plugins/sy-plugin-md/plugin.toml` and points to the
# release binary on the user's host.
api = "1"

[plugin]
id = "sy-plugin-md"
name = "Markdown Previewer"
version = "0.1.0"
description = "Renders Markdown to PNG via pulldown-cmark + cosmic-text + tiny-skia"
authors = ["Dmitriy Gajewski <dmytrogajewski@gmail.com>"]
license = "MIT"
homepage = "https://github.com/dmytrogajewski/sy"
api_min = "1"
api_max = "1"

[plugin.binary]
# Path resolved relative to the manifest directory at install time.
exec = "./bin/sy-plugin-md"

[[capability]]
kind = "previewer"
mime = "text/markdown"
[[capability]]
kind = "previewer"
url = "*.md"
[[capability]]
kind = "previewer"
url = "*.markdown"

# The previewer reads its argument path; no other host capabilities
# are required (no network, no exec, no knowledge plane). Markdown
# images are inline-decoded inside the plugin process via tiny-skia's
# `Pixmap::decode_png` so we don't need `host.fs.read` for them.
[needs]
fs_read = ["arg.path"]
fs_write = []
preview = []
knowledge = []
network = []
exec = []

[limits]
memory_mb = 256
cpu_seconds = 30
nofile = 256
spawn_timeout_ms = 2000
shutdown_timeout_ms = 1000

[env]
RUST_LOG = "info"
