[package]
name = "sy-desktop-shell"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "sy-desktop-shell"
path = "src/main.rs"

[features]
default = ["gui-iced", "mon-exporter"]
gui-iced = ["dep:iced", "dep:iced_layershell", "dep:sy-theme"]
mon-exporter = ["sy-core/mon-exporter"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
image.workspace = true
iced = { workspace = true, optional = true }
iced_layershell = { workspace = true, optional = true }
libc.workspace = true
sd-notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sy-core = { path = "../sy-core" }
sy-ipc = { path = "../sy-ipc" }
ulid.workspace = true
sy-agent = { path = "../sy-agent" }
sy-theme = { path = "../sy-theme", optional = true }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
zbus.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
