# sy: defer the AMD XDNA NPU driver until after pivot_root.
#
# Problem this solves:
#   The amdxdna driver calls request_firmware("amdnpu/<pid>/npu.dev.sbin")
#   the first time the PCI device is probed. That blob (~430 KB) lives
#   under /lib/firmware on the real root filesystem and is shipped by
#   the xrt-plugin-amdxdna rpm. If udev autoloads amdxdna from inside
#   the initramfs — which happens because the kernel-shipped module
#   has a PCI alias matching 1022:17f0 — request_firmware() returns
#   -ENOENT (the firmware is not in the initramfs), aie2_init bails,
#   and amdxdna_probe permanently records "Hardware init failed, ret -2"
#   on the device. The kernel does NOT retry probe after pivot_root,
#   so /dev/accel/accel0 never appears for the rest of the session and
#   the whole NPU plane (sy-knowledge → bge-reranker-v2-m3 → VitisAI EP)
#   collapses.
#
# This regressed on 2026-05-20 when kernel-core-7.0.6-100.fc43 was
# reinstalled and dracut regenerated the initramfs with a slightly
# different module set / udev autoload ordering. Previously the probe
# happened to land after pivot; the new initramfs lands it before.
#
# Fix:
#   `omit_drivers` keeps amdxdna out of the initramfs entirely, so the
#   kernel can only autoload it once the real /lib/firmware tree is
#   mounted. The sister unit sy-amdxdna-load.service makes the explicit
#   post-pivot load a hard dependency for downstream NPU services.
#
# Install path: /etc/dracut.conf.d/sy-amdxdna-defer.conf
# Activation:   sudo dracut --force /boot/initramfs-$(uname -r).img $(uname -r)
# (Handled by `scripts/install-system-npu.sh` and `make install-system-npu`.)

omit_drivers+=" amdxdna "
