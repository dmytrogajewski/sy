# Installed by `sy power apply` (sy-power Step 27).
#
# Disables amd_dynamic_epp so sy-powerd's per-policy EPP writes
# under /sys/.../cpufreq/policy*/energy_performance_preference take
# effect. With amd_dynamic_epp=enable the kernel silently no-ops
# those writes.
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} amd_dynamic_epp=disable"
