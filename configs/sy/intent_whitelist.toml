# sy power — intent channel whitelists.
#
# Loaded by `src/power/intent/logind.rs` (Step 5) to classify
# `org.freedesktop.login1.Manager.ListInhibitors` entries as
# `IntentEvent::CallActive`. SPEC §2 "Deep Dives — 12-signal panel"
# names Teams / Slack / Discord (all hold `Inhibit("idle")`) and Zoom
# (which also exposes `com.zoom.HotKeyService` on the session bus —
# Step 7 ScreenCast acts as a fallback when Zoom skips the inhibitor).
#
# Matching is substring + case-insensitive against the inhibitor's
# `Who` field (the kernel does not normalise casing across apps).

[call]
who = [
  "Microsoft Teams",
  "Slack",
  "zoom",
  "Discord",
]
