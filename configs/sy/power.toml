# sy power — daemon configuration.
#
# Schema owned by `src/power/config.rs`. Default values match SPEC §6
# Open Question defaults:
#   - bandit.alpha    = 0.05  (Conservative LinUCB regret bound vs baseline)
#   - onboarding.days = 14    (Apple-style rules-only rehearsal window)
#
# `SY_POWER_ONBOARDING_DAYS` overrides the onboarding default for dev /
# bench machines that don't want to wait two weeks.

# ── Bandit arms ──────────────────────────────────────────────────────
#
# Eight pre-validated profiles per SPEC §4 "Bandit Arms". Each arm is
# a tuple of (platform_profile, epp, igpu_mode, npu_pmode, cgroup).
# Names are stable identifiers used by `sy power profile <name>` and
# the audit log; do not rename without coordinating across the bandit
# state file (Step 18) and the audit replay (Step 23).

[[arms]]
name = "whisper"
platform_profile = "quiet"
epp = "power"
igpu_mode = "POWER_SAVING"
npu_pmode = "powersaver"
cgroup = { cpu_uclamp_max = 40 }

[[arms]]
name = "idle"
platform_profile = "quiet"
epp = "balance_power"
igpu_mode = "POWER_SAVING"
npu_pmode = "powersaver"
cgroup = {}

[[arms]]
name = "browse"
platform_profile = "balanced"
epp = "balance_power"
igpu_mode = "BOOTUP_DEFAULT"
npu_pmode = "powersaver"
cgroup = {}

[[arms]]
name = "call"
platform_profile = "balanced"
epp = "balance_performance"
igpu_mode = "BOOTUP_DEFAULT"
npu_pmode = "balanced"
cgroup = { cpu_uclamp_min = 20 }

[[arms]]
name = "code"
platform_profile = "balanced"
epp = "balance_performance"
igpu_mode = "BOOTUP_DEFAULT"
npu_pmode = "balanced"
cgroup = { cpu_uclamp_min = 30 }

[[arms]]
name = "build"
platform_profile = "performance"
epp = "balance_performance"
igpu_mode = "POWER_SAVING"
npu_pmode = "powersaver"
cgroup = { cpu_uclamp_min = 60 }

[[arms]]
name = "npu-burst"
platform_profile = "performance"
epp = "balance_power"
igpu_mode = "POWER_SAVING"
npu_pmode = "turbo"
cgroup = {}

[[arms]]
name = "flat-out"
platform_profile = "performance"
epp = "performance"
igpu_mode = "3D_FULL_SCREEN"
npu_pmode = "turbo"
cgroup = { cpu_uclamp_min = 80 }

# SPEC §4 "Concrete Shield Constraint Set (HX 370)". Step 17's
# `shield::dfa::transition` reads these — keep the table here, not
# hard-coded inside the DFA, so a future hardware revision (e.g. an
# HX 380 with a different Tjmax) is a config-only change.
[shield]
tctl_peak_c = 90.0
tctl_act_c = 85.0
tctl_sustained_60s_avg_c = 80.0
package_power_excursion_w_per_2s = 15.0
fan_rpm_max = 5500
battery_low_dc_pct = 25
battery_emergency_dc_pct = 10
profile_thrash_min_interval_s = 30
meeting_lock_after_vad_s = 30
npu_pmode_min_interval_s = 5
epp_delta_max_per_tick = 64

# Conservative LinUCB hyper-parameters land in R3 Step 18.
[bandit]
# alpha = 0.05

# Bandit reward shaping (SPEC §6 Open Question 5, Roadmap Step 21).
#
# `bandit::reward::compute_reward` combines three terms per tick:
#
#   reward = perf_per_watt_weight * (Δwork_proxy / package_power_w)
#          - thermal_weight       * max(0, tctl - 80°C) / 10
#          - thrash_weight        * {1 if arm changed else 0}
#
# Trade-off:
#   - perf_per_watt_weight (1.0) keeps "did we do useful work per
#     watt" the dominant signal — the bandit chases efficiency.
#   - thermal_weight (0.5) is a hard nudge once Tctl crosses 80°C;
#     half the perf/W weight so warmth slows learning but never
#     drowns it out (the shield's HOT state owns the actual safety
#     floor).
#   - thrash_weight (0.3) is small but ever-present so the bandit
#     prefers stable arms when other terms tie — anti-thrash without
#     freezing exploration.
#
# Result is clamped to [-10, 10] in `bandit::reward` so the
# Sherman-Morrison update on `A_a` stays well-conditioned.
[reward]
# perf_per_watt_weight = 1.0
# thermal_weight = 0.5
# thrash_weight = 0.3

# Onboarding window. Mirrors Apple Optimized Battery Charging.
[onboarding]
# days = 14

# SPEC §4 rules baseline — the hand-tuned `ShieldState -> arm` lookup
# table consulted by `policy::rules_baseline` (Roadmap Step 18). This is
# the floor the Conservative LinUCB bandit must not underperform: every
# state maps to exactly one canonical arm name from the table above.
# The roadmap text reads "BATTERY_LOW -> quiet" but `quiet` is a
# `platform_profile` value, not an arm name — the lowest-power arm is
# `whisper` (platform=quiet, epp=power), which is what we ship.
[rules_baseline]
cool_ac = "browse"
warm_ac = "code"
hot = "idle"
battery_low = "whisper"
meeting = "call"
