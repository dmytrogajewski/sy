# sy-power sysfs knob permissions — landed as a follow-up to sy-power
# roadmap Step 15 (actuator A). The Step 15 design note read "Fedora 43
# ships platform_profile as `wheel:wheel rw-rw-r--`" but the 2026-05-20
# real-machine ship (kernel 7.0.6-100.fc43, AMD HX 370) found the file
# at `root:root rw-r--r--` — userland writes EACCES, the EPP lever
# silently no-ops, and the bandit's actuation path can't land.
#
# This tmpfiles.d drop-in flips the platform_profile + per-policy EPP
# files to `root:wheel 0664` at boot, restoring the design assumption.
# Members of `wheel` (operator + sy-powerd user-mode daemon) can then
# write the levers without `sudo` and without polkit interactivity —
# the polkit rule at `/etc/polkit-1/rules.d/10-sy-power.rules` covers
# the D-Bus path for Step 36's PPD shim; this file covers the direct
# sysfs path Step 15's actuators use.
#
# Install path:
#   sudo install -m 0644 configs/systemd/tmpfiles.d/sy-power.conf \
#       /etc/tmpfiles.d/sy-power.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/sy-power.conf
#
# Reapplies on every boot via systemd-tmpfiles-setup.service.
#
# The `z` directive adjusts permissions of an EXISTING node (it does
# not create it) so we never accidentally materialise a file the
# kernel hadn't already exposed.
z /sys/firmware/acpi/platform_profile 0664 root wheel - -
# BUG-20260525-2350: the explicit `policy0`..`policy11` enumeration
# that used to live here only covered a 12-core CPU; the deployment
# moved to a 24-policy hybrid CPU (HX 370) and policies 12-23 stayed
# at `root:root 0644`, unwritable by sy-powerd. A single glob entry
# (per `tmpfiles.d(5)`, the `*` wildcard is supported in path
# arguments) survives both directions of kernel renumbering and
# every future CPU upgrade. The companion guard at
# `tests/tmpfiles_policy_coverage.rs` keeps this from regressing.
z /sys/devices/system/cpu/cpufreq/policy*/energy_performance_preference 0664 root wheel - -
# Roadmap §H3 originally added three `z` lines for
# `/sys/class/drm/card0|1|2/device/power_dpm_force_performance_level`.
# Step P3-4 superseded those: the kernel renumbers drm cards across
# reboots based on probe order, so card-indexed tmpfiles entries can't
# follow the renumbering. The udev rule
# `configs/udev/rules.d/99-sy-power.rules` matches by vendor
# (`ATTR{vendor}=="0x1002"`) and applies the same perm overrides to
# whichever `card<N>` the kernel assigns — see the rule's header for
# the full rationale.
