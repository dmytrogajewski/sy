# sy — bound systemd-coredump storage for the agentic OS layer.
#
# Install (privileged, documented — sy never writes /etc itself):
#   sudo install -D -m 0644 configs/systemd/coredump.conf.d/sy.conf \
#       /etc/systemd/coredump.conf.d/sy.conf
#
# Why: sy's planes run inside 12-16 GiB MemoryHigh cgroups
# (configs/systemd/user/sy-knowledge.service, specs/bugs/BUG-20260927-0910.md)
# and the aiplane worker children inherit them. systemd-coredump's upstream
# defaults on a 64-bit host are ExternalSizeMax=32G, MaxUse=10 % of the
# volume capped at 4 GiB, and KeepFree=15 % capped at 4 GiB. On this 1.9 TiB
# root volume, which sits at 92 % full, that means one crashing NPU worker may
# write a 32 GiB core and the spool may drain the filesystem to 4 GiB free.
# A cold whisper compile measured 19.5 GiB RSS, so this was not hypothetical:
# three sy cores landed on disk in one morning.
#
# 2 GiB still yields a usable forensic core for a SIGSEGV inside the
# ONNX Runtime / VitisAI worker (Rust panics are captured independently by
# sy_core::obs::panic and surfaced by `sy crash list`), and KeepFree= keeps
# room for qdrant, dnf and journal writes under the same roof.
[Coredump]
ExternalSizeMax=2G
ProcessSizeMax=2G
JournalSizeMax=64M
MaxUse=2G
KeepFree=20G
