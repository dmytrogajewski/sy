# ~/.config/yazi/yazi.toml
# Wires installed plugins into yazi as previewers and fetchers.
# Default previewers/fetchers still apply; entries here are prepended.

[plugin]

prepend_previewers = [
  # Markdown
  { name = "*.md",                          run = "glow" },

  # Tabular data (CSV / TSV / Parquet / JSON via DuckDB)
  { name = "*.csv",                         run = "duckdb" },
  { name = "*.tsv",                         run = "duckdb" },
  { name = "*.parquet",                     run = "duckdb" },
  { name = "*.json",                        run = "duckdb" },

  # 3D models (f3d)
  { name = "*.stl",                         run = "f3d-preview" },
  { name = "*.step",                        run = "f3d-preview" },
  { name = "*.3mf",                         run = "f3d-preview" },
  { name = "*.obj",                         run = "f3d-preview" },
  { name = "*.glb",                         run = "f3d-preview" },
  { name = "*.gltf",                        run = "f3d-preview" },
  { name = "*.fbx",                         run = "f3d-preview" },
  { name = "*.ply",                         run = "f3d-preview" },

  # Audio / video metadata (text overlay)
  { mime = "audio/*",                       run = "mediainfo" },
  { mime = "video/*",                       run = "mediainfo" },

  # Archive contents (lsar)
  { mime = "application/zip",               run = "lsar" },
  { mime = "application/gzip",              run = "lsar" },
  { mime = "application/x-tar",             run = "lsar" },
  { mime = "application/x-bzip2",           run = "lsar" },
  { mime = "application/x-7z-compressed",   run = "lsar" },
  { mime = "application/x-rar",             run = "lsar" },
  { mime = "application/x-xz",              run = "lsar" },
]

# git.yazi linemode badges next to each file
prepend_fetchers = [
  { id = "git", name = "*",  run = "git" },
  { id = "git", name = "*/", run = "git" },
]
