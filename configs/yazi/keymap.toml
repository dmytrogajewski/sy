# ~/.config/yazi/keymap.toml
# Plugin keybindings prepended to defaults. Built-ins still work.
#
# Conventions:
#   g <x>   general plugin commands (jumps, git, archive, mount, etc.)
#   m <x>   bookmarks via yamb
#   b <x>   bookmarks via whoosh
#   t <x>   toggle-pane visibility/size
#   P <x>   projects
#   <C-w>   dual-pane window control
#
# Adjust to taste. If a binding conflicts with your muscle memory, edit here.

[mgr]

prepend_keymap = [
  # smart-enter: <Enter>/l opens a file OR descends into a directory
  { on = "<Enter>",        run = "plugin smart-enter",                 desc = "Open file / enter dir" },
  { on = "l",              run = "plugin smart-enter",                 desc = "Open file / enter dir" },

  # ---- jumps ----
  { on = [ "g", "c" ],     run = "plugin jump-to-char",                desc = "Jump to file by char" },
  { on = [ "g", "j" ],     run = "plugin easyjump",                    desc = "Easy jump (label)" },
  { on = [ "g", "s" ],     run = "plugin searchjump",                  desc = "Search jump (flash)" },

  # ---- git ----
  { on = [ "g", "l" ],     run = "plugin lazygit",                     desc = "Open lazygit" },

  # ---- archive / diff / rsync / chmod ----
  { on = [ "g", "z" ],     run = "plugin archive",                     desc = "Compress selection" },
  { on = [ "g", "d" ],     run = "plugin diff",                        desc = "Diff files" },
  { on = [ "g", "r" ],     run = "plugin rsync",                       desc = "Rsync menu" },
  { on = [ "g", "x" ],     run = "plugin chmod",                       desc = "chmod" },

  # ---- trash / mounts / remote ----
  { on = [ "g", "t" ],     run = "plugin recycle-bin",                 desc = "Recycle bin" },
  { on = [ "g", "m" ],     run = "plugin mount",                       desc = "Mount / unmount disks" },
  { on = [ "g", "S" ],     run = "plugin sshfs",                       desc = "SSHFS remote mounts" },

  # ---- misc utilities ----
  { on = [ "g", "w" ],     run = "plugin what-size",                   desc = "Selection / cwd size" },
  { on = [ "g", "a" ],     run = "plugin file-actions",                desc = "Run file action" },
  { on = "<C-p>",          run = "plugin command-palette",             desc = "Command palette" },

  # ---- bookmarks: yamb (m...) ----
  { on = [ "m", "a" ],     run = "plugin yamb save",                   desc = "Save bookmark" },
  { on = [ "m", "d" ],     run = "plugin yamb delete",                 desc = "Delete bookmark" },
  { on = [ "m", "D" ],     run = "plugin yamb delete_all",             desc = "Delete all bookmarks" },
  { on = [ "m", "r" ],     run = "plugin yamb rename",                 desc = "Rename bookmark" },
  { on = [ "m", "g" ],     run = "plugin yamb jump_by_key",            desc = "Jump bookmark (key)" },
  { on = [ "m", "G" ],     run = "plugin yamb jump_by_fzf",            desc = "Jump bookmark (fzf)" },

  # ---- whoosh (alt bookmark manager) ----
  { on = [ "b", "b" ],     run = "plugin whoosh",                      desc = "Whoosh bookmarks" },

  # ---- projects ----
  { on = [ "P", "s" ],     run = "plugin projects save",               desc = "Save project" },
  { on = [ "P", "l" ],     run = "plugin projects load",               desc = "Load project" },
  { on = [ "P", "d" ],     run = "plugin projects delete",             desc = "Delete project" },

  # ---- toggle-pane (t...) ----
  { on = [ "t", "p" ],     run = "plugin toggle-pane min-parent",      desc = "Hide parent pane" },
  { on = [ "t", "P" ],     run = "plugin toggle-pane max-parent",      desc = "Maximize parent pane" },
  { on = [ "t", "v" ],     run = "plugin toggle-pane min-preview",     desc = "Hide preview pane" },
  { on = [ "t", "V" ],     run = "plugin toggle-pane max-preview",     desc = "Maximize preview pane" },
  { on = [ "t", "c" ],     run = "plugin toggle-pane min-current",     desc = "Hide current pane" },
  { on = [ "t", "C" ],     run = "plugin toggle-pane max-current",     desc = "Maximize current pane" },

  # ---- dual-pane (<C-w>...) ----
  { on = [ "<C-w>", "v" ], run = "plugin dual-pane toggle",            desc = "Toggle dual-pane" },
  { on = [ "<C-w>", "h" ], run = "plugin dual-pane prev-pane",         desc = "Focus left pane" },
  { on = [ "<C-w>", "l" ], run = "plugin dual-pane next-pane",         desc = "Focus right pane" },
]
