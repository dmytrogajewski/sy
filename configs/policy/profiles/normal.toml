# normal — interactive CLI default profile.
#
# Per specs/research/architecture-refactor/SPEC.md §4.4 example: rg /
# cargo / git allowlisted with argv globs (see schema.rs for glob
# semantics: `*` matches everything, `test*` matches anything starting
# with "test", `[]` matches nothing). github.com:443 and crates.io:443
# are reachable for `cargo fetch` and `git fetch origin`.
#
# `require_consent = "once_per_session"` plus an allowlisted tool is
# treated as Decision::Allow by the Step 1 resolver (no ConsentStore
# yet — Step 6 will track session grants). `EveryCall` always falls
# through to ConsentRequired even for allowlisted tools; see
# resolver.rs head comment.

# System-runtime paths every non-toy binary needs at startup:
#
# - `/etc` — `ld.so.cache`, SSL trust store, locale archive, MIME
#   types, `nsswitch.conf`, resolver config. The dynamic linker
#   refuses to start without `ld.so.cache`.
# - `/proc` — `/proc/self/maps`, `/proc/sys/vm/mmap_min_addr`,
#   `/proc/self/status` are read at startup by every modern JIT
#   (Bun/V8/Go/JVM). Without these, Bun deliberately panics at
#   0xBBADBEEF before any user code runs.
# - `/dev` — `/dev/urandom` (crypto init), `/dev/null`,
#   `/dev/tty`. Landlock can only restrict by directory, not by
#   single file, so the entire dir has to be reachable.
# - `/sys/devices/system/cpu` and a few siblings — CPU-count and
#   topology probes during runtime init.
#
# Read access to procfs/sysfs is not a sandbox escape: Landlock +
# `PR_SET_NO_NEW_PRIVS` prevent privilege changes; seccomp blocks
# the high-risk syscalls (`ptrace`, `bpf`, `mount`, `setns`,
# `unshare`, …).
read_paths = [
    "$REPO",
    "/usr",
    "/etc",
    "/proc",
    "/dev",
    "/sys",
    # Agents install themselves under XDG dirs and `node` /
    # `claude-agent-acp` resolve children inside their own install
    # tree. `extend_read_paths_with_bin_dir` adds the immediate
    # binary's parent, but it can't predict the symlink target a
    # child spawn will hit (e.g. `~/.local/bin/claude` resolves to
    # `~/.local/share/claude/versions/<X>/`). These three cover the
    # typical XDG install footprint without exposing `~/.ssh`,
    # `~/Documents`, browser profiles, etc.
    "$HOME/.local",
    "$HOME/.config",
    "$HOME/.cache",
]
# `/tmp` is the canonical scratch dir for every spawned tool. The
# agent's binary install dir is added automatically at
# `sandbox-exec` time (`agt::mod::extend_read_paths_with_bin_dir`),
# so it does not need to be listed here.
write_paths = ["$REPO", "/tmp", "$HOME/.cache"]
# `DBUS_SESSION_BUS_ADDRESS`, `XDG_RUNTIME_DIR`, and `WAYLAND_DISPLAY`
# are required for desktop integrations the agent reaches for
# (`notify-send`, `wl-copy`, `playerctl`, …). Without them the agent
# either fails with "Cannot autolaunch D-Bus without X11 $DISPLAY" or
# wastes turns rediscovering `/run/user/<uid>/bus`. Read-only from the
# sandbox's perspective — the bus socket itself is under `/run/user`
# which Landlock already grants via `$HOME` adjacency rules where
# applicable, and DBus enforces its own per-connection authz.
env_passthrough_allowlist = [
    "PATH",
    "HOME",
    "LANG",
    "TERM",
    "DBUS_SESSION_BUS_ADDRESS",
    "XDG_RUNTIME_DIR",
    "WAYLAND_DISPLAY",
]
max_runtime_seconds = 60
max_stdout_bytes = 16777216
max_memory_mb = 1024
max_pids = 256
deny_network = false
require_consent = "once_per_session"

[[exec_allowlist]]
bin = "/usr/bin/rg"
argv = ["*"]

[[exec_allowlist]]
bin = "/usr/bin/cargo"
argv = ["test*", "build*", "check*"]

[[exec_allowlist]]
bin = "/usr/bin/git"
argv = ["status", "diff*", "log*", "show*"]

[[net_outbound_allowlist]]
host = "github.com"
port = 443

[[net_outbound_allowlist]]
host = "crates.io"
port = 443
