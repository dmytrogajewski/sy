<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- sy-power: grant `wheel` ownership of net.hadess.PowerProfiles so
     the user-mode `sy-powerd` daemon's PPD shim (Step 36) can claim
     the well-known name. Loads AFTER vendor net.hadess.PowerProfiles.conf
     (alphabetical) so the wheel allowance overrides the root-only default.
     The shim mode is gated by SY_POWER_WITH_PPD=1 (Step 37) — drop this
     file once that env var is unset to revert to PPD-coexistence mode.
 -->
<busconfig>
  <policy group="wheel">
    <allow own="net.hadess.PowerProfiles"/>
  </policy>
</busconfig>
