[workspace]
# Virtual workspace shell. Root `sy` binary plus `crates/sy-core`
# (shared vocabulary). See specs/research/architecture-refactor/SPEC.md
# §3.2 K1 for the workspace shape rationale: thin binary + small
# vocabulary crate, lockstep-versioned, `publish = false`, with
# `sy-core` kept deliberately minimal so it never becomes a hub-
# rebuild bottleneck.
members = [".", "crates/sy-core", "crates/sy-ipc", "crates/sy-testutils"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Versions + feature sets live here so future workspace members
# (sy-ipc, sy-aiplane, …) can pick them up via `<name>.workspace =
# true`. Long-form comments stay attached to the line they document.
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
iced = { version = "0.14", features = ["tokio", "wgpu", "image"] }
iced_layershell = "0.17"
# Stack-bar thumbnail pipeline. Decoders pinned to the formats
# cliphist surfaces in its binary-data preview (`parse_image_ext` in
# src/stack/clip.rs); cache always re-encodes as PNG so the bar reads
# one format off disk. `default-features = false` keeps openexr / hdr
# / pnm / tiff / qoi off the build path — none of them appear in the
# clipboard or stack pools.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Knowledge plane.
#
# `load-dynamic` lets us re-point ORT at AMD's bundled onnxruntime
# (which has VitisAI EP built in) at runtime — see embed.rs. The
# `cuda` feature used to live here as a fallback, but the daemon is
# the only process that loads ORT now (everyone else goes through
# `ipc::request(Req::Search{...})`), and the daemon always has the
# NPU. CLI/MCP fallbacks land on CPU, which is fine for one-shot
# debug queries and avoids burning GPU VRAM.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "vitis", "load-dynamic"] }
# ort 2.0-rc.12's `vitis` feature forgets to enable api-18 on ort-sys, so
# the SessionOptionsAppendExecutionProvider_VitisAI binding isn't exposed.
# Force it ourselves.
ort-sys = { version = "=2.0.0-rc.12", features = ["api-18"] }
# E5 tokenizer (XLM-RoBERTa BPE). Model + tokenizer.json are produced by
# scripts/prep_npu_embed.py and live in ~/.cache/sy/npu-embed.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
notify = "8"
notify-debouncer-mini = "0.6"
ignore = "0.4"
globset = "0.4"
which = "7"
serde_yml = "0.0.12"
html2text = "0.16"
blake3 = "1"
# SHA-256 for the policy fingerprint stamped on every audit-log record
# (SPEC §4.4 step 2 + step "Audit log" `SY_POLICY_SHA`). Lives in the
# workspace deps so Step 5 (`src/agt/audit.rs`) can re-use the same
# digest without re-hashing.
sha2 = "0.10"
libc = "0.2"
# Format-preserving TOML editor used by `sy knowledge add/rm/schedule` so
# comments and section ordering survive round-trips.
toml_edit = "0.22"
# Already a transitive of iced_layershell + notify-debouncer-mini, so
# pulling it as a dev-dep adds no compile-tree weight. Used by the
# stack-bar thumbnail tests (`src/stack/state.rs`,
# `src/stack/clip.rs`) to spin up isolated cache dirs without
# touching the user's `XDG_CACHE_HOME`.
tempfile = "3"
# IPC v1 envelope + framing. `tokio-util/codec` for LengthDelimitedCodec
# (SPEC §4.2 framing); `bytes` for BytesMut buffers exposed by the codec;
# `ulid` for canonical Crockford-base32 request_id (SPEC §4.2 example).
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
bytes = "1"
ulid = { version = "1", features = ["serde"] }
# IPC v1 Step 2 (Server/Client). `rustix/process` for `geteuid()`
# alongside tokio's `UnixStream::peer_cred()` — together they implement
# the SPEC §4.2 `SO_PEERCRED` origin gate. `futures-util/sink` is the
# minimal slice of `futures-rs` needed to call `.send()` / `.next()`
# on the `tokio_util::codec::Framed` Stream+Sink halves.
rustix = { version = "1", default-features = false, features = ["std", "process", "thread"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# arch-agent-sandbox Step 3: in-process Landlock LSM ruleset
# construction (SPEC §4.4 step 3 layer 2). 0.4.x exposes ABI v4 which
# the Fedora 43 kernel (6.7+, currently 7.0) supports, including
# `LANDLOCK_ACCESS_NET_CONNECT_TCP` for the per-port outbound gate.
landlock = "0.4"
# arch-agent-sandbox Step 3: seccomp-bpf filter compilation (SPEC §4.4
# step 3 layer 3). Default action `Allow`; we explicitly `Errno(EPERM)`
# the high-risk syscalls (ptrace, bpf, mount, …) listed in
# `src/agt/sandbox/seccomp_layer.rs`.
seccompiler = "0.5"
# Aiplane scheduler queues (SPEC §4.3 / arch-aiplane-scheduler Step 2).
# The dispatcher loop uses crossbeam's `select_biased!`-style polling
# to prefer higher-priority classes — a single-threaded design that
# doesn't need the await semantics of `tokio::sync::mpsc`.
crossbeam-channel = "0.5"
# Observability stack (SPEC §4.6 / arch-observability Step 1).
# `tracing` is the structured-event API; `tracing-subscriber` composes
# the layered Registry (EnvFilter + fmt to stderr + JSON appender);
# `tracing-journald` lands daemon events in systemd-journal so
# `journalctl --user -u sy-*` works; `tracing-appender` provides the
# rolling JSONL sink under `$XDG_STATE_HOME/sy/logs/`. `tracing-error`
# and `tracing-panic` are deferred to Steps 3/4 and Step 6 so we
# don't ship unused deps now (AGENTS.md no-dead-code rule).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }
tracing-journald = "0.3"
tracing-appender = "0.2"
# Metrics stack (SPEC §4.6 / arch-observability Step 7).
# `metrics` is the call-site facade — `counter!`/`gauge!`/`histogram!`
# emissions are no-ops until a recorder is installed; that lets Zone
# 3's scheduler and Zone 4's sandbox declare their metrics now without
# blocking on the Zone 6.2 UDS exporter. `metrics-util` is dev-only —
# tests install a `DebuggingRecorder` to snapshot counter values
# without leaking process-global state across the test binary.
metrics = "0.24"
metrics-util = "0.20"
# arch-agent-sandbox Step 5 (SPEC §4.4 "Audit log"): structured
# journald sink via `libsystemd::logging::journal_send` and zstd
# compression of rotated `audit.jsonl` archives. Pure-Rust
# `libsystemd` 0.7 talks the journal datagram protocol directly; no
# external libsystemd .so required (matches the daemon's
# `tracing-journald` layer used by `arch-observability`). `zstd`
# 0.13 vendors libzstd if the system copy is missing.
libsystemd = "0.7"
zstd = "0.13"
# arch-supervision Step 4 (SPEC §4.5 "Rust integration"): `sd_notify(READY=1)`
# after listener bind, `STOPPING=1 STATUS="draining"` on SIGTERM, and the
# WATCHDOG=1 ping at half the `WATCHDOG_USEC` interval. Pure-Rust shim
# over the `NOTIFY_SOCKET` datagram protocol; no libsystemd .so needed
# (matches `tracing-journald`/`libsystemd-0.7`'s stance — wire format
# only). 0.5 drops the `unset_env` bool argument of 0.4, returns
# `Option<Duration>` directly from `watchdog_enabled`.
sd-notify = "0.5"
# sy-power Step 5 (SPEC §2 "12-signal panel" — logind inhibitor watcher).
# The `intent::logind` channel calls `org.freedesktop.login1.Manager
# .ListInhibitors` on the system bus and emits `IntentEvent::CallActive`
# when Teams / Slack / Zoom / Discord hold `Inhibit("idle")`. 5.x is
# already pinned in `Cargo.lock` (transitive via iced's `mundy`), so
# declaring it here adds no version skew. The `blocking` subset keeps
# the channel synchronous + matches Step 4's `PsiChannel` shape.
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
# sy-power Step 7 (SPEC §2 "12-signal panel" — cgroup ancestry intent
# channel). `intent::cgroup` walks `/proc/<pid>/cgroup` ancestry to
# match new processes against an allow-list and emits
# `IntentEvent::ProcessFromAncestor`. 0.18 is the current stable line;
# only the `Process::cgroups` parser is used so the dep is small.
procfs = "0.18"
# sy-power Step 24 (SPEC §2 "GRU on CPU via tract" + Phase R4
# inference path). Pure-Rust ONNX runtime; sub-ms on the tiny GRU
# (16 input × 16 hidden × 5-class output, ~2-5k params). Pinned to
# the 0.22 minor — 0.23 is dev only. Re-exports the prost-generated
# `pb::ModelProto` types under `tract_onnx::pb`, which the warmup-
# fixture generator (`examples/gen_warmup_gru.rs`) uses to emit a
# rules-equivalent ONNX without a separate protobuf schema.
tract-onnx = "0.22"
# Step 24 hot-reload primitive. The daemon (Step 26) holds an
# `ArcSwap<Model>`; the trainer (Step 25) swaps freshly-exported
# ONNX in without taking a lock on the read path.
arc-swap = "1"
# Step 24 weight serialisation per SPEC §3 ("Cargo deps added").
# Used by Step 25's trainer to round-trip GRU weights between
# burn-ndarray and the ONNX exporter; declared here so the dep
# graph lands in one place.
safetensors = "0.4"
# sy-power Step 25: offline GRU trainer. SPEC §3 / §6 pinned burn
# 0.20; that release was never published to crates.io so the
# workspace pins 0.21 — the closest published minor with the same
# major. `default-features = false` keeps the GPU backends
# (wgpu/cuda/rocm/tch/candle/router/remote/collective) off the
# build path; only the pure-Rust `ndarray` backend and the
# `autodiff` adjoint backend are pulled in. The `train` feature
# ships the optim crate (`burn::optim::Adam` etc.) that the
# retrain loop in `src/power/trainer.rs` drives. We hand-emit the
# ONNX protobuf from the trained weights (SPEC §6 documented
# fallback) instead of relying on burn's `onnx-export` feature —
# that path lives in `gen_warmup_gru.rs` already and round-trips
# cleanly through tract. `prost` was already a dev-dep used by
# `gen_warmup_gru.rs`; promoted to a workspace dep so the trainer
# can reuse `tract_onnx::pb` types without redeclaring the schema
# (prost is a transitive of tract-onnx so this adds zero compile
# cost).
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff", "train"] }
burn-ndarray = { version = "0.21", default-features = false }
burn-autodiff = { version = "0.21", default-features = false }
prost = "0.11"
# sy-power Step 34 (SPEC §RV.2): SVG plot rendering for the offline
# power report. The roadmap pin reads `plotters = "0.4"`; that minor
# is unreleased — 0.3.7 is the latest published as of 2026-05-20, so
# we pin the published line. `default-features = false` drops the
# `bitmap_backend` (and its `image` transitive — already in the tree
# via the stack-bar pipeline, but no need to widen its feature set),
# `ttf`/`font-kit` (we render with the built-in stroke font so the
# SVG stays self-contained and we don't ship Inter as a separate
# asset yet — Step 35 revisits typography), and `chrono` (the
# extractor module already owns the time axis as `f64` ticks). The
# enabled feature set covers every plot variant: `svg_backend` for
# the `SVGBackend`, `all_series` for `LineSeries`/`AreaSeries`,
# `all_elements` for `Histogram`/`Rectangle` cells (heatmap and bar
# charts), and `full_palette` so we can use distinct named colours
# alongside the line-style / marker-shape monochrome cues.
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "all_series", "all_elements", "full_palette"] }
# sy-power Step 35 (SPEC §RV.2 / Phase RV finale — `sy power show` PDF
# assembly). The roadmap pin reads `typst = "0.13"` + `typst-pdf =
# "0.13"`; the typst library API requires a full `World`
# implementation (font book, file system, source resolver, package
# manager, ~3 KLoC of glue) and bundles a 6 MB font set that the
# binary-size budget does not allow. `pdf-writer` 0.14 is the same
# crate the typst project itself uses to emit the final PDF bytes —
# step-by-step, no font loading, no async, no system deps. Authoring
# the 8-panel report directly via `pdf-writer` keeps the
# pure-function contract Step 33's metric extractors established
# (`Vec<u8>` in, `Vec<u8>` out) without dragging in the typst world.
pdf-writer = "0.14"
# sy-power Step P2-2 (sy-power-production roadmap): rasterise the Step-34
# SVG plots to RGB pixmaps so `compile_pdf` can embed them as PDF Image
# XObjects. `default-features = false` drops `text` (fontdb + rustybuzz +
# unicode-* trees), `system-fonts` (fontconfig), `memmap-fonts`, and
# `raster-images` (gif + jpeg + webp) — none of plotters' SVG output
# needs fonts on disk (plotters serialises glyphs as `<text>` tags whose
# missing-font outlines degrade to bounding-box placeholders; captions
# live in the PDF text stream instead) or raster sub-images. The dep
# tree is therefore confined to usvg's geometry layer + tiny-skia, the
# latter already in tree as a plotters transitive.
resvg = { version = "0.45", default-features = false }
# sy-power Step P2-2: PDF `/FlateDecode` stream compression for the
# rasterised plot pixels. `flate2` is already in the dep tree via
# `burn-core` (LZ4/Flate codec for tensor archives) and `png` (a
# tiny-skia transitive), so declaring it here adds zero compile
# cost. Pinned to the workspace `1` line — the API surface
# (`ZlibEncoder` + `write_all`) has been stable since 1.0.
flate2 = "1"

[package]
name = "sy"
version.workspace = true
edition.workspace = true
description = "Agentic OS layer for Fedora — single Rust binary plus declarative configs that ship an on-device NPU inference plane, agent sandbox, MCP fabric, semantic knowledge plane, power governor, and a niri/wayland rice"
# `sy` is a Fedora-coupled OS layer (AMD venv re-exec dance,
# user-systemd supervision, polkit/SELinux integration), not a
# library; it cannot be `cargo install`-ed by an end user. The
# workspace-header comment above documents the rationale at length;
# this field is the load-bearing assertion. Decision recorded in
# `docs/adr/0004-publish-policy.md` (Item 24, PLAN-full.md).
publish = false
# Declared even though `publish = false` so `cargo info` / `docs.rs`
# / `crates.io` would pick the README up if the publish policy ever
# flips. Cheap and lossless — see ADR-0004.
readme = "README.md"
license = "MIT"

[[bin]]
name = "sy"
path = "src/main.rs"

[features]
default = ["bar-iced"]
# Enables the iced + iced_layershell GUI for `sy stack bar`. On by default
# so a plain `cargo build --release` produces a working stack bar — niri
# spawn-at-startup is fire-and-forget and silently swallows a missing-feature
# stub. Disable with `--no-default-features` if you need a CLI/MCP-only build.
bar-iced = ["dep:iced", "dep:iced_layershell"]
# sy-power Step 36 (Phase R7): integration tests that round-trip
# against a real `net.hadess.PowerProfiles` shim on the system bus.
# Gated because CI lacks a system D-Bus + polkit grant for the
# `net.hadess.PowerProfiles` well-known name; flip on locally with
# `cargo test --features test-dbus` once `power-profiles-daemon`
# has been masked.
test-dbus = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
walkdir.workspace = true
iced = { workspace = true, optional = true }
iced_layershell = { workspace = true, optional = true }
image.workspace = true
ort.workspace = true
ort-sys.workspace = true
tokenizers.workspace = true
reqwest.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
ignore.workspace = true
globset.workspace = true
which.workspace = true
serde_yml.workspace = true
html2text.workspace = true
blake3.workspace = true
# arch-agent-sandbox Step 1: SHA-256 of the canonical-serialised
# resolved policy, exposed via `agt::policy::Resolver::fingerprint()`.
# Same digest is reused by `agt::audit::AuditRecord::policy_sha` in
# Step 5 — pulling the dep here, not there, so the resolver tests
# already cover the hash plumbing.
sha2.workspace = true
libc.workspace = true
toml_edit.workspace = true
sy-core = { path = "crates/sy-core" }
sy-ipc = { path = "crates/sy-ipc" }
tokio-util.workspace = true
# arch-observability Step 2: the supervisor / worker / knowledge
# daemon emit structured `tracing` events directly (instead of the
# legacy `eprintln!("…")` lines). `sy-core::obs::init` installs the
# subscriber stack; this dep gives the binary the `info!`/`warn!`/
# `error!` macros at every call site.
tracing.workspace = true
crossbeam-channel.workspace = true
futures-util.workspace = true
ulid.workspace = true
rustix.workspace = true
# arch-agent-sandbox Step 3: in-process Landlock + seccomp + env scrub
# sandbox layers (SPEC §4.4 step 3). `landlock` builds the FS/TCP
# ruleset; `seccompiler` compiles the syscall deny set. Both are
# applied in the child between `fork(2)` and `execve(2)` via
# `CommandExt::pre_exec` (see `src/agt/sandbox/exec.rs`).
landlock.workspace = true
seccompiler.workspace = true
# arch-observability Step 7: scheduler.rs + supervisor/mod.rs emit
# `sy_workload_*` / `sy_queue_depth` / `sy_models_warm` via the
# `metrics` facade. No recorder is installed in production (Zone 6.2
# UDS prometheus exporter is deferred); emissions are cheap no-ops
# until then.
metrics.workspace = true
# arch-agent-sandbox Step 5 (SPEC §4.4 "Audit log"): dual-sink audit
# log. `libsystemd::logging::journal_send` lands the structured `SY_*`
# fields in journald; `zstd::stream::copy_encode` compresses the
# 64 MiB rotated `audit.jsonl.1` archives.
libsystemd.workspace = true
zstd.workspace = true
# arch-supervision Step 4: each daemon calls `sy_core::notify::ready()`
# after its listener bind so `Type=notify` units enter `active (running)`
# instead of staying `activating`. The dep is workspace-pinned; the
# call sites live in `src/knowledge/daemon.rs`, `src/agt/daemon.rs`,
# and `src/stack/bar/app.rs`.
sd-notify.workspace = true
# sy-power Step 5: `intent::logind` watcher subscribes to systemd-logind's
# inhibitor list over the system bus and emits `IntentEvent::CallActive`
# when Teams / Slack / Zoom / Discord hold `Inhibit("idle")`. The
# `blocking-api` feature gives us `zbus::blocking::Connection`, which
# keeps the channel synchronous (matches Step 4's `PsiChannel`).
zbus.workspace = true
# sy-power Step 7: `intent::cgroup` walks `/proc/<pid>/cgroup` to match
# new processes against an allow-list and emits
# `IntentEvent::ProcessFromAncestor`. The pure-fn parser also runs in
# tests against synthetic cgroup lines, so the bus-less degradation is
# baked in.
procfs.workspace = true
# sy-power Step 24: GRU inference path (SPEC §2 "tract on CPU"),
# hot-reload via `ArcSwap<Model>`, weights round-trip via
# `safetensors` in Step 25.
tract-onnx.workspace = true
arc-swap.workspace = true
safetensors.workspace = true
# sy-power Step 25: burn-ndarray trainer + autodiff. Pure-CPU; the
# trainer runs in the daemon's idle+plugged window (Step 26). The
# ONNX export is hand-emitted via `prost` against `tract_onnx::pb`
# types — SPEC §6's documented fallback to burn's `onnx-export`
# feature. `prost` was previously dev-only (gen_warmup_gru.rs);
# the trainer needs the same encode path at runtime.
burn.workspace = true
burn-ndarray.workspace = true
burn-autodiff.workspace = true
prost.workspace = true
# sy-power Step 34 (SPEC §RV.2): SVG plot rendering for the offline
# `sy power show` PDF. Pure-Rust SVG backend; no font-kit, no
# bitmap_backend, no `image` widening — see the workspace dep comment
# above for the feature-set rationale. The dep is dev-light: the
# daemon never instantiates a `Plot`; only the one-shot
# `sy power show` (Step 36) does, after the metrics extractors of
# Step 33 produce a `ReportMetrics<'_>` bundle.
plotters.workspace = true
# sy-power Step 35: see workspace dep comment for the typst→pdf-writer
# deviation rationale. The dep is one-shot only — the daemon never
# instantiates the report; only `sy power show` does, after the
# Step-33 metric extractors produce a `ReportMetrics<'_>` bundle.
pdf-writer.workspace = true
# sy-power Step P2-2: PDF image-embed path for the Step-34 SVG plots.
# Pure-Rust SVG rasteriser; pulls usvg + tiny-skia (already a plotters
# transitive). See workspace dep comment for the feature-set rationale.
resvg.workspace = true
# sy-power Step P2-2: zlib compression of the DeviceRGB pixel stream
# embedded under PDF `/FlateDecode`. Transitively present via burn /
# png so the dep adds no compile cost.
flate2.workspace = true

[[example]]
name = "gen_warmup_gru"
path = "examples/gen_warmup_gru.rs"

[dev-dependencies]
tempfile.workspace = true
# `DebuggingRecorder` powers the Step 7 scheduler test (`tests::
# workload_completed_increments_counter`). Dev-only — the production
# build never installs a recorder.
metrics-util.workspace = true
# Captures `tracing` events into a per-test buffer so the
# arch-observability Step 2 conversion tests can assert on
# structured fields without installing a process-global subscriber
# (which `tracing` only allows once per process). See the
# `warn_on_npu_eagain_emits_structured_field` and
# `info_workload_completed_carries_latency` tests.
tracing-test = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
