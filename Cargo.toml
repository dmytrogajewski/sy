walkdir.workspace = true
iced = { workspace = true, optional = true }
iced_layershell = { workspace = true, optional = true }
image.workspace = true
ort.workspace = true
ort-sys.workspace = true
tokenizers.workspace = true
# aiplane Stt: Whisper log-mel feature extractor STFT. See workspace
