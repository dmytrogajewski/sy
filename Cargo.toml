[workspace]
# Virtual workspace shell. Root `sy` binary plus `crates/sy-core`
# (shared vocabulary). See specs/research/architecture-refactor/SPEC.md
# §3.2 K1 for the workspace shape rationale: thin binary + small
# vocabulary crate, lockstep-versioned, `publish = false`, with
# `sy-core` kept deliberately minimal so it never becomes a hub-
# rebuild bottleneck.
members = [".", "crates/sy-core", "crates/sy-ipc", "crates/sy-testutils", "crates/sy-plugin-fake", "crates/sy-plugin-pdk", "crates/sy-plugin-md"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Versions + feature sets live here so future workspace members
# (sy-ipc, sy-aiplane, …) can pick them up via `<name>.workspace =
# true`. Long-form comments stay attached to the line they document.
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# knowledge-retrieval-iter1 Step 18 (REQ-8): English natural-language
# date *ranges* for `query::expand_dates`. two_timer is the only Rust
# crate returning ranges (not single instants); it takes a deterministic
# reference `now` via `Config::now(NaiveDateTime)` so the pure expander
# stays clock-free in tests. RU/seasons/holidays are handled by an
# in-Rust lexicon (no Rust crate parses Russian; Duckling/HeidelTime are
# anti-goal snowflakes). Audited 2.2.5: transitive deps are
# chrono/pidgin/regex/serde_regex/lazy_static — `cargo deny check
# advisories` clean, no RUSTSEC (unlike the rejected bm25→fxhash).
two_timer = "2"
clap = { version = "4", features = ["derive", "env"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
iced = { version = "0.14", features = ["tokio", "wgpu", "image", "canvas"] }
iced_layershell = "0.17"
# Stack-bar thumbnail pipeline. Decoders pinned to the formats
# cliphist surfaces in its binary-data preview (`parse_image_ext` in
# src/stack/clip.rs); cache always re-encodes as PNG so the bar reads
# one format off disk. `default-features = false` keeps openexr / hdr
# / pnm / tiff / qoi off the build path — none of them appear in the
# clipboard or stack pools.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Knowledge plane.
#
# `load-dynamic` lets us re-point ORT at AMD's bundled onnxruntime
# (which has VitisAI EP built in) at runtime — see embed.rs. The
# `cuda` feature used to live here as a fallback, but the daemon is
# the only process that loads ORT now (everyone else goes through
# `ipc::request(Req::Search{...})`), and the daemon always has the
# NPU. CLI/MCP fallbacks land on CPU, which is fine for one-shot
# debug queries and avoids burning GPU VRAM.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "vitis", "load-dynamic"] }
# ort 2.0-rc.12's `vitis` feature forgets to enable api-18 on ort-sys, so
# the SessionOptionsAppendExecutionProvider_VitisAI binding isn't exposed.
# Force it ourselves.
ort-sys = { version = "=2.0.0-rc.12", features = ["api-18"] }
# E5 tokenizer (XLM-RoBERTa BPE). Model + tokenizer.json are produced by
# scripts/prep_npu_embed.py and live in ~/.cache/sy/npu-embed.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", default-features = false, features = ["limit", "timeout", "util"] }
utoipa = { version = "5", default-features = false, features = ["macros"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
hmac = "0.12"
secrecy = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
x509-parser = { version = "0.18", default-features = false, features = ["verify"] }
rusqlite = { version = "0.40.0", default-features = false, features = ["backup", "bundled"] }
rusqlite_migration = { version = "2.6.0", default-features = false }
governor = { version = "0.10.4", default-features = false, features = ["dashmap", "std"] }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["rustls-tls"] }
notify = "8"
notify-debouncer-mini = "0.6"
ignore = "0.4"
globset = "0.4"
which = "7"
serde_yml = "0.0.12"
html2text = "0.16"
blake3 = "1"
# SHA-256 for the policy fingerprint stamped on every audit-log record
# (SPEC §4.4 step 2 + step "Audit log" `SY_POLICY_SHA`). Lives in the
# workspace deps so Step 5 (`src/agt/audit.rs`) can re-use the same
# digest without re-hashing.
sha2 = "0.10"
libc = "0.2"
# Format-preserving TOML editor used by `sy knowledge add/rm/schedule` so
# comments and section ordering survive round-trips.
toml_edit = "0.22"
# Already a transitive of iced_layershell + notify-debouncer-mini, so
# pulling it as a dev-dep adds no compile-tree weight. Used by the
# stack-bar thumbnail tests (`src/stack/state.rs`,
# `src/stack/clip.rs`) to spin up isolated cache dirs without
# touching the user's `XDG_CACHE_HOME`.
tempfile = "3"
# IPC v1 envelope + framing. `tokio-util/codec` for LengthDelimitedCodec
# (SPEC §4.2 framing); `bytes` for BytesMut buffers exposed by the codec;
# `ulid` for canonical Crockford-base32 request_id (SPEC §4.2 example).
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
# sy-file-manager Step 16 (`fs::copy`): `wrappers::ReceiverStream`
# adapts the `mpsc::channel<OpEvent>` the copy executor feeds into the
# `impl Stream<Item = OpEvent>` the `pub async fn copy(...)` contract
# exposes (SPEC §3.2 row 4 progress beat). `default-features = false`
# drops the `sync` feature we don't use; we only need the
# `Receiver` ↔ `Stream` shim.
tokio-stream = { version = "0.1", default-features = false }
bytes = "1"
base64 = "0.22"
ulid = { version = "1", features = ["serde"] }
# IPC v1 Step 2 (Server/Client). `rustix/process` for `geteuid()` and
# `rustix/system` for namespace-safe in-process `uname()`.
# alongside tokio's `UnixStream::peer_cred()` — together they implement
# the SPEC §4.2 `SO_PEERCRED` origin gate. `futures-util/sink` is the
# minimal slice of `futures-rs` needed to call `.send()` / `.next()`
# on the `tokio_util::codec::Framed` Stream+Sink halves.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process", "thread", "system"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# arch-agent-sandbox Step 3: in-process Landlock LSM ruleset
# construction (SPEC §4.4 step 3 layer 2). 0.4.x exposes ABI v4 which
# the Fedora 43 kernel (6.7+, currently 7.0) supports, including
# `LANDLOCK_ACCESS_NET_CONNECT_TCP` for the per-port outbound gate.
landlock = "0.4"
# arch-agent-sandbox Step 3: seccomp-bpf filter compilation (SPEC §4.4
# step 3 layer 3). Default action `Allow`; we explicitly `Errno(EPERM)`
# the high-risk syscalls (ptrace, bpf, mount, …) listed in
# `src/agt/sandbox/seccomp_layer.rs`.
seccompiler = "0.5"
# Aiplane scheduler queues (SPEC §4.3 / arch-aiplane-scheduler Step 2).
# The dispatcher loop uses crossbeam's `select_biased!`-style polling
# to prefer higher-priority classes — a single-threaded design that
# doesn't need the await semantics of `tokio::sync::mpsc`.
crossbeam-channel = "0.5"
# Observability stack (SPEC §4.6 / arch-observability Step 1).
# `tracing` is the structured-event API; `tracing-subscriber` composes
# the layered Registry (EnvFilter + fmt to stderr + JSON appender);
# `tracing-journald` lands daemon events in systemd-journal so
# `journalctl --user -u sy-*` works; `tracing-appender` provides the
# rolling JSONL sink under `$XDG_STATE_HOME/sy/logs/`. `tracing-error`
# and `tracing-panic` are deferred to Steps 3/4 and Step 6 so we
# don't ship unused deps now (AGENTS.md no-dead-code rule).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }
tracing-journald = "0.3"
tracing-appender = "0.2"
# Metrics stack (SPEC §4.6 / arch-observability Step 7).
# `metrics` is the call-site facade — `counter!`/`gauge!`/`histogram!`
# emissions are no-ops until a recorder is installed; that lets Zone
# 3's scheduler and Zone 4's sandbox declare their metrics now without
# blocking on the Zone 6.2 UDS exporter. `metrics-util` is dev-only —
# tests install a `DebuggingRecorder` to snapshot counter values
# without leaking process-global state across the test binary.
metrics = "0.24"
metrics-util = "0.20"
# arch-agent-sandbox Step 5 (SPEC §4.4 "Audit log"): structured
# journald sink via `libsystemd::logging::journal_send` and zstd
# compression of rotated `audit.jsonl` archives. Pure-Rust
# `libsystemd` 0.7 talks the journal datagram protocol directly; no
# external libsystemd .so required (matches the daemon's
# `tracing-journald` layer used by `arch-observability`). `zstd`
# 0.13 vendors libzstd if the system copy is missing.
libsystemd = "0.7"
zstd = "0.13"
# arch-supervision Step 4 (SPEC §4.5 "Rust integration"): `sd_notify(READY=1)`
# after listener bind, `STOPPING=1 STATUS="draining"` on SIGTERM, and the
# WATCHDOG=1 ping at half the `WATCHDOG_USEC` interval. Pure-Rust shim
# over the `NOTIFY_SOCKET` datagram protocol; no libsystemd .so needed
# (matches `tracing-journald`/`libsystemd-0.7`'s stance — wire format
# only). 0.5 drops the `unset_env` bool argument of 0.4, returns
# `Option<Duration>` directly from `watchdog_enabled`.
sd-notify = "0.5"
# sy-power Step 5 (SPEC §2 "12-signal panel" — logind inhibitor watcher).
# The `intent::logind` channel calls `org.freedesktop.login1.Manager
# .ListInhibitors` on the system bus and emits `IntentEvent::CallActive`
# when Teams / Slack / Zoom / Discord hold `Inhibit("idle")`. 5.x is
# already pinned in `Cargo.lock` (transitive via iced's `mundy`), so
# declaring it here adds no version skew. The `blocking` subset keeps
# the channel synchronous + matches Step 4's `PsiChannel` shape.
#
# Backend MUST stay `async-io` (zbus's default), NOT `tokio`: the power
# daemon drives a `current_thread` tokio runtime, and the `tokio`-backed
# `zbus::blocking::block_on` builds its own multi-thread runtime — which
# aborts with "Cannot start a runtime from within a runtime" the moment
# `LogindChannel`/`MprisChannel`/etc. touch the bus on the runtime thread
# (BUG-20260608-2244). `async-io` block_on is runtime-agnostic and also
# serves the one async user (`file::fs::mounts`) on its own reactor.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# sy-power Step 7 (SPEC §2 "12-signal panel" — cgroup ancestry intent
# channel). `intent::cgroup` walks `/proc/<pid>/cgroup` ancestry to
# match new processes against an allow-list and emits
# `IntentEvent::ProcessFromAncestor`. 0.18 is the current stable line;
# only the `Process::cgroups` parser is used so the dep is small.
procfs = "0.18"
# sy-power Step 24 (SPEC §2 "GRU on CPU via tract" + Phase R4
# inference path). Pure-Rust ONNX runtime; sub-ms on the tiny GRU
# (16 input × 16 hidden × 5-class output, ~2-5k params). Pinned to
# the 0.22 minor — 0.23 is dev only. Re-exports the prost-generated
# `pb::ModelProto` types under `tract_onnx::pb`, which the warmup-
# fixture generator (`examples/gen_warmup_gru.rs`) uses to emit a
# rules-equivalent ONNX without a separate protobuf schema.
# aiplane Stt (whisper-medium): real-valued STFT for the Whisper
# log-mel feature extractor (`src/aiplane/workloads/whisper_mel.rs`).
# `rustfft` is already in the lock tree (pulled transitively by
# `tract-onnx`); declaring it as a direct dep adds no new download and
# pins the same audited 6.x line. Pure-Rust, no C deps, MIT/Apache-2.0.
rustfft = "6"
tract-onnx = "0.22"
# Step 24 hot-reload primitive. The daemon (Step 26) holds an
# `ArcSwap<Model>`; the trainer (Step 25) swaps freshly-exported
# ONNX in without taking a lock on the read path.
arc-swap = "1"
# Step 24 weight serialisation per SPEC §3 ("Cargo deps added").
# Used by Step 25's trainer to round-trip GRU weights between
# burn-ndarray and the ONNX exporter; declared here so the dep
# graph lands in one place.
safetensors = "0.4"
# sy-power Step 25: offline GRU trainer. SPEC §3 / §6 pinned burn
# 0.20; that release was never published to crates.io so the
# workspace pins 0.21 — the closest published minor with the same
# major. `default-features = false` keeps the GPU backends
# (wgpu/cuda/rocm/tch/candle/router/remote/collective) off the
# build path; only the pure-Rust `ndarray` backend and the
# `autodiff` adjoint backend are pulled in. The `train` feature
# ships the optim crate (`burn::optim::Adam` etc.) that the
# retrain loop in `src/power/trainer.rs` drives. We hand-emit the
# ONNX protobuf from the trained weights (SPEC §6 documented
# fallback) instead of relying on burn's `onnx-export` feature —
# that path lives in `gen_warmup_gru.rs` already and round-trips
# cleanly through tract. `prost` was already a dev-dep used by
# `gen_warmup_gru.rs`; promoted to a workspace dep so the trainer
# can reuse `tract_onnx::pb` types without redeclaring the schema
# (prost is a transitive of tract-onnx so this adds zero compile
# cost).
burn = { version = "0.21", default-features = false, features = ["ndarray", "autodiff", "train"] }
burn-ndarray = { version = "0.21", default-features = false }
burn-autodiff = { version = "0.21", default-features = false }
prost = "0.11"
# sy-power Step 34 (SPEC §RV.2): SVG plot rendering for the offline
# power report. The roadmap pin reads `plotters = "0.4"`; that minor
# is unreleased — 0.3.7 is the latest published as of 2026-05-20, so
# we pin the published line. `default-features = false` drops the
# `bitmap_backend` (and its `image` transitive — already in the tree
# via the stack-bar pipeline, but no need to widen its feature set),
# `ttf`/`font-kit` (we render with the built-in stroke font so the
# SVG stays self-contained and we don't ship Inter as a separate
# asset yet — Step 35 revisits typography), and `chrono` (the
# extractor module already owns the time axis as `f64` ticks). The
# enabled feature set covers every plot variant: `svg_backend` for
# the `SVGBackend`, `all_series` for `LineSeries`/`AreaSeries`,
# `all_elements` for `Histogram`/`Rectangle` cells (heatmap and bar
# charts), and `full_palette` so we can use distinct named colours
# alongside the line-style / marker-shape monochrome cues.
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "all_series", "all_elements", "full_palette"] }
# sy-power Step 35 (SPEC §RV.2 / Phase RV finale — `sy power show` PDF
# assembly). The roadmap pin reads `typst = "0.13"` + `typst-pdf =
# "0.13"`; the typst library API requires a full `World`
# implementation (font book, file system, source resolver, package
# manager, ~3 KLoC of glue) and bundles a 6 MB font set that the
# binary-size budget does not allow. `pdf-writer` 0.14 is the same
# crate the typst project itself uses to emit the final PDF bytes —
# step-by-step, no font loading, no async, no system deps. Authoring
# the 8-panel report directly via `pdf-writer` keeps the
# pure-function contract Step 33's metric extractors established
# (`Vec<u8>` in, `Vec<u8>` out) without dragging in the typst world.
pdf-writer = "0.14"
# sy-power Step P2-2 (sy-power-production roadmap): rasterise the Step-34
# SVG plots to RGB pixmaps so `compile_pdf` can embed them as PDF Image
# XObjects. `default-features = false` drops `text` (fontdb + rustybuzz +
# unicode-* trees), `system-fonts` (fontconfig), `memmap-fonts`, and
# `raster-images` (gif + jpeg + webp) — none of plotters' SVG output
# needs fonts on disk (plotters serialises glyphs as `<text>` tags whose
# missing-font outlines degrade to bounding-box placeholders; captions
# live in the PDF text stream instead) or raster sub-images. The dep
# tree is therefore confined to usvg's geometry layer + tiny-skia, the
# latter already in tree as a plotters transitive.
resvg = { version = "0.45", default-features = false }
# sy-power Step P2-2: PDF `/FlateDecode` stream compression for the
# rasterised plot pixels. `flate2` is already in the dep tree via
# `burn-core` (LZ4/Flate codec for tensor archives) and `png` (a
# tiny-skia transitive), so declaring it here adds zero compile
# cost. Pinned to the workspace `1` line — the API surface
# (`ZlibEncoder` + `write_all`) has been stable since 1.0.
flate2 = "1"
# sy-mon Step 7 (SPEC §3 SCOPE item 3 "Ring buffer"): mmap-backed
# N×M f32 grid for the `sy mon collect` history file. memmap2 is
# already a transitive of `iced` (via cosmic-text → fontdb), so the
# explicit workspace dep just pins the version we link against
# without widening the compile tree. `nix` is already a transitive
# of `libsystemd`; declaring it here gives sy-core access to
# `fcntl::{flock, FlockArg}` for cross-process exclusion on the
# ring file. The `fcntl` symbols are unconditional in nix 0.29's
# top-level module, so no feature flag is required.
memmap2 = "0.9"
nix = "0.29"
# sy-mon Step 9 (SPEC §3 SCOPE item 1 "`mon-exporter` feature on every
# plane"): the Prometheus UDS exposition surface every daemon binds
# under `$XDG_RUNTIME_DIR/sy/<plane>/metrics.sock`. The `uds-listener`
# feature pulls in the crate's hyper-based HTTP/1.1 listener — this is
# the "second HTTP stack" risk called out in SPEC §6, mitigated by the
# `mon-exporter` cargo feature gate below so debug/CLI builds without
# the gate don't link hyper at all. `default-features = false` drops
# the TCP `http-listener` and `push-gateway` paths sy will never use
# (single-host, UDS-only). Held at the workspace level so Step 10
# (aiplane daemon) and Step 20 (remaining planes) can opt in with
# `metrics-exporter-prometheus.workspace = true`.
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["uds-listener"] }
# sy-mon Step 12 (SPEC §3 SCOPE item 3 "scrapes every plane UDS" + §4
# Dependencies row). `sy mon collect` reads each plane's
# `metrics.sock` exposition and folds the parsed samples into a
# `SystemSnapshot`. Apache-2.0, ~200 LoC, used only by the aggregator
# tick — never in hot paths. Pinned to the latest published 0.2 line
# (0.2.5 on 2026-05-22); SPEC §6 mitigation for "`prometheus-parse`
# lightly maintained" is an in-tree fork should upstream stall.
prometheus-parse = "0.2"
# sy-mon Step 18 (SPEC §3 SCOPE §4 "filter overlay" — regex on metric
# name). The popup's `/` overlay compiles the typed pattern into a
# `regex::Regex` and the per-panel projections filter their metric
# label lists through it. Already transitively present in the lockfile
# (via `tracing-subscriber`'s `env-filter` feature); the explicit
# workspace dep just pins the version we link against and keeps the
# binary's filter overlay independent of that transitive's feature
# set. Confined to the binary's `src/mon/` tree — sy-core's
# `SystemSnapshot` doesn't touch regex.
regex = "1"
# sy-file-manager Step 9 (SPEC §3.2 row 10 — `sy plugin install` minisign
# verify). Pure-Rust, zero-dependency verifier (no FFI). The bin pulls
# the verifier in production; tests pair it with the `minisign` crate
# (bin dev-dep) which provides the matching signer so fixtures sign +
# verify hermetically inside the test process.
minisign-verify = "0.2"
# sy-file-manager Step 12 (SPEC §3.3 item 18 — `sy-plugin-md` canary).
# Pure-Rust markdown → PNG pipeline. `pulldown-cmark` is a pull-style
# CommonMark parser (zero-dep beyond `unicase`); `cosmic-text` 0.15 is
# already a transitive of `iced`'s text shaper (pinning to the version
# the workspace already links against avoids a second cosmic-text in
# the dep tree); `tiny-skia` 0.11 is already a transitive of `resvg`
# (same rationale). `png` is pulled via `tiny-skia`'s `Pixmap::encode_png`
# so we don't depend on the `png` crate directly. The plugin runs as a
# child process under the sandbox supervisor; no GUI, no `iced`.
pulldown-cmark = { version = "0.10", default-features = false }
cosmic-text = "0.15"
tiny-skia = "0.11"
# sy-file-manager Step 18 (SPEC §3.3 item 5 + §3.4 anti-goal "data
# loss" — freedesktop Trash spec round-trip). Pure-Rust implementation
# of the XDG trash protocol so other DEs (Nautilus, Dolphin,
# gnome-shell, `gio trash --list`) can see and restore our trashes.
# The crate's `home_trash()` honours `$XDG_DATA_HOME`, which is the
# hook the tests use to redirect to a hermetic tempdir without
# clobbering the operator's real trash. `default-features = false`
# drops the Windows-only COM init flags but keeps `chrono`, which is
# load-bearing: without it, `freedesktop.rs::move_to_trash` skips the
# `DeletionDate=YYYY-MM-DDThh:mm:ss` line in the `.trashinfo` file,
# which the `trash_preserves_freedesktop_trashinfo` test (and other
# DEs like `gio trash --list`) parse for the "deleted at" column.
trash = { version = "5", default-features = false, features = ["chrono"] }
# sy-file-manager Step 19 (SPEC §3.3 item 11 — live updates + MIME
# detection ladder). `tree_magic_mini` is the sniff-side magic-number
# matcher we fall back to when the extension lookup misses or returns
# `application/octet-stream`; `xdg-mime` reads `/usr/share/mime/` to
# satisfy the extension-first path of the ladder. Both are pure-Rust;
# `tree_magic_mini` ships the freedesktop magic table inline so no
# system DB is required for the sniff side. The `xdg-mime` lookup is
# best-effort — on a stripped container without `/usr/share/mime/`
# the ladder degrades to `application/octet-stream` (documented in
# `fs::mime`'s module doc).
tree_magic_mini = "3"
xdg-mime = "0.4"
# sy-file-manager Step 25 (SPEC §3.3 item 7 — `/` in-pane fuzzy filter via
# `nucleo`). `nucleo::Matcher` + `nucleo::Config::DEFAULT.match_paths`
# powers `src/file/search/filename.rs::matches` and the Step 25 commandbar
# verb completion. Helix's fuzzy matcher: MPL-2.0, ~30 KB binary impact
# (no worker-thread runtime is used; we drive the low-level `Matcher`
# directly on `Utf32Str` views). Workspace dep so future planes
# (`sy knowledge` selector UX, `sy plugin list` filter) can reuse it
# without a second matcher in the tree.
nucleo = "0.5"
# sy-file-manager Step 26 (SPEC §3.3 item 8 — text/* built-in
# previewer). `syntect` ships the Sublime-grammar syntax highlighter
# we use to colour the first 64 KiB of any text/* file the previewer
# dispatcher routes to. `default-features = false` + `default-fancy`
# swaps the C `onig` regex backend (oniguruma FFI) for the pure-Rust
# `fancy-regex` engine — no system library required, no
# cross-compilation hazard, hermetic build. The bundled
# `.sublime-syntax` files + `base16-ocean.dark` theme are pulled in
# via `default-syntaxes` / `default-themes` so the first-use
# OnceLock warmup needs no on-disk assets. The dep is bin-only:
# gated behind the `gui-iced` feature (Step 26's previewer modules
# only compile when iced is in the tree), so
# `--no-default-features` builds drop it entirely.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# sy-file-manager Step 31 (SPEC §3.3 item 15 — `recently-used.xbel` +
# bookmarks). `quick-xml` is the freedesktop XBEL writer/reader we use
# from `src/file/bookmarks.rs` to stamp `<bookmark>` entries on
# `file.open` (the production daemon hook) and to round-trip-parse the
# resulting document for the `bookmarks::tests::xbel_written_on_open`
# DoD. Already a transitive of the iced text stack so this just pins
# the workspace version we link against; no new compile-tree weight.
quick-xml = "0.36"

[package]
name = "sy"
version.workspace = true
edition.workspace = true
description = "Agentic OS layer for Fedora — single Rust binary plus declarative configs that ship an on-device NPU inference plane, agent sandbox, MCP fabric, semantic knowledge plane, power governor, and a niri/wayland rice"
# `sy` is a Fedora-coupled OS layer (AMD venv re-exec dance,
# user-systemd supervision, polkit/SELinux integration), not a
# library; it cannot be `cargo install`-ed by an end user. The
# workspace-header comment above documents the rationale at length;
# this field is the load-bearing assertion. Decision recorded in
# `docs/adr/0004-publish-policy.md` (Item 24, PLAN-full.md).
publish = false
# Declared even though `publish = false` so `cargo info` / `docs.rs`
# / `crates.io` would pick the README up if the publish policy ever
# flips. Cheap and lossless — see ADR-0004.
readme = "README.md"
license = "MIT"

[[bin]]
name = "sy"
path = "src/main.rs"

[features]
# sy-mon Step 10 (DoD bullet 3): the aiplane plane's metrics socket is
# bound out of the box in release builds. `mon-exporter` forwards to
# `sy-core/mon-exporter`, which gates the shared `obs::mon_exporter`
# module on the hyper-backed `metrics-exporter-prometheus uds-listener`
# feature. `--no-default-features` opts out — the daemon then skips the
# bind entirely (see `src/knowledge/daemon.rs`'s `#[cfg]` guard).
default = ["gui-iced", "mon-exporter", "file-iouring"]
# Enables the iced + iced_layershell GUI shared by `sy stack bar`, the
# `sy mon` popup, and the `sy file` xdg-toplevel manager (Step 23+). On
# by default so a plain `cargo build --release` produces a working GUI —
# niri spawn-at-startup is fire-and-forget and silently swallows a
# missing-feature stub. Disable with `--no-default-features` if you need
# a CLI/MCP-only build.
gui-iced = ["dep:iced", "dep:iced_layershell", "dep:syntect"]
# Backwards-compat alias from the pre-Step-23 era when this feature was
# `sy stack bar`-only. Kept for one release cycle so external builds
# pinning `--features bar-iced` keep working; new call sites should use
# `gui-iced` directly.
bar-iced = ["gui-iced"]
# sy-power Step 36 (Phase R7): integration tests that round-trip
# against a real `net.hadess.PowerProfiles` shim on the system bus.
# Gated because CI lacks a system D-Bus + polkit grant for the
# `net.hadess.PowerProfiles` well-known name; flip on locally with
# `cargo test --features test-dbus` once `power-profiles-daemon`
# has been masked.
test-dbus = []
# aiplane Stt: real-NPU end-to-end tests that load the whisper-medium
# encoder + decoder ONNX over the VitisAI EP and transcribe the AMD
# sample WAV. Off by default — the default gate is FakeWorkload-only
# (no `/dev/accel/accel0`). Flip on locally with
# `cargo test --features test-npu` (or `make test-npu`) once the model
# cache is populated by `prep_npu_workload.py --workload stt`.
test-npu = []
# sy-mon Step 9 (SPEC §3 SCOPE item 1 + §6 risk "second HTTP stack"):
# enable the Prometheus UDS exposition surface on every plane that
# depends on `sy-core`. Off by default so `--no-default-features`
# builds (and tests without the feature) don't link hyper. The `sy`
# binary forwards to `sy-core/mon-exporter`; each plane daemon calls
# `sy_core::obs::mon_exporter::install(path)` when this feature is on
# (Steps 10 + 20). Pure rollout switch — no behavioural change at the
# workspace root until a daemon binds.
mon-exporter = ["sy-core/mon-exporter"]
# sy-file-manager Step 17 (SPEC §3.2 row 4 — bulk-copy win): switch
# `fs::copy` onto `tokio-uring` when the batch crosses the threshold
# (>100 files OR >256 MiB). Default-on on Linux; the runtime degrades
# gracefully to the Step-16 byte-stream path when
# `tokio_uring::Runtime::new()` returns Err (old kernels, sandbox
# without io_uring). Drop the feature (e.g. on non-Linux cross builds)
# and the dep + io_uring dispatch fall out entirely.
file-iouring = ["dep:tokio-uring"]
# DGX Spark ARM64 artifact boundary. Step 1 adds only the fixed read-only
# bootstrap inspector; later server-only dependencies attach exclusively here.
spark-agent = [
    "dep:axum",
    "dep:axum-server",
    "dep:hmac",
    "dep:governor",
    "dep:rcgen",
    "dep:rusqlite",
    "dep:rusqlite_migration",
    "dep:rustls",
    "dep:secrecy",
    "dep:tower",
    "dep:utoipa",
    "dep:x509-parser",
    "dep:bollard",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:hf-hub",
]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
two_timer.workspace = true
clap.workspace = true
minijinja.workspace = true
