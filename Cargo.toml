[dev-dependencies]
tempfile.workspace = true
# `DebuggingRecorder` powers the Step 7 scheduler test (`tests::
# workload_completed_increments_counter`). Dev-only — the production
# build never installs a recorder.
metrics-util.workspace = true
# Captures `tracing` events into a per-test buffer so the
# arch-observability Step 2 conversion tests can assert on
# structured fields without installing a process-global subscriber
# (which `tracing` only allows once per process). See the
# `warn_on_npu_eagain_emits_structured_field` and
# `info_workload_completed_carries_latency` tests.
tracing-test = "0.2"
# sy-file-manager Step 9 fixture signer. The `minisign` crate ships
# the signing side of the protocol that `minisign-verify` (production)
# consumes. Used only by `tests/sy_plugin_install.rs` and the
# `step09_*` E2E in `tests/sy_file_journey_e2e.rs` to mint signed
# fixtures hermetically inside the test process — no pre-baked
# keypair on disk, no network. 0.9 is the latest published line.
minisign = "0.9"
# sy-file-manager Step 12 E2E (`tests/sy_file_journey_e2e.rs::step12_*`):
# the journey test decodes the PNG payload returned by `sy plugin exec
# sy-plugin-md preview` and runs an inline aHash perceptual diff
# against the committed golden. `tiny-skia` is already in the
# workspace dep tree (transitive of `plotters`/`resvg`); declaring it
# here as a dev-dep just gives the integration-test binary access to
# `Pixmap::decode_png` without re-implementing a PNG decoder. Bin-only
# dev surface — sy's production code never decodes PNGs.
tiny-skia.workspace = true

