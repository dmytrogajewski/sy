rusqlite = { workspace = true, optional = true }
rusqlite_migration = { workspace = true, optional = true }
governor = { workspace = true, optional = true }
bollard = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
notify.workspace = true
notify-debouncer-mini.workspace = true
ignore.workspace = true
globset.workspace = true
which.workspace = true
serde_yml.workspace = true
html2text.workspace = true
blake3.workspace = true
# arch-agent-sandbox Step 1: SHA-256 of the canonical-serialised
# resolved policy, exposed via `agt::policy::Resolver::fingerprint()`.
# Same digest is reused by `agt::audit::AuditRecord::policy_sha` in
# Step 5 — pulling the dep here, not there, so the resolver tests
# already cover the hash plumbing.
sha2.workspace = true
libc.workspace = true
toml_edit.workspace = true
sy-core = { version = "=0.1.0", path = "crates/sy-core" }
sy-ipc = { version = "=0.1.0", path = "crates/sy-ipc" }
tokio-util.workspace = true
# sy-file-manager Step 16 (`fs::copy`): `Stream<Item = OpEvent>` shim
# over the executor-owned `mpsc::channel`. See workspace dep block.
tokio-stream.workspace = true
# sy-file-manager Step 2 (plugin runtime transport): `BytesMut`-based
# encode/decode buffer for `JsonRpcCodec` in `src/plugin/transport.rs`.
# Same `bytes` version the workspace already pins for sy-ipc's codec.
bytes.workspace = true
base64.workspace = true
# sy-file-manager Step 3 (plugin runtime sandbox): `setrlimit` wrapper
# for `RLIMIT_AS / RLIMIT_CPU / RLIMIT_NOFILE` applied inside the
# `pre_exec` closure of `src/plugin/sandbox.rs::build_command`. The
# crate is already a workspace dep (sy-core/mon ring uses the
# unconditional `fcntl` surface); the bin target additionally needs
# the gated `resource` feature for `nix::sys::resource::Resource` and
# `setrlimit`, which sy-core never touches.
nix = { workspace = true, features = ["resource"] }
# arch-observability Step 2: the supervisor / worker / knowledge
# daemon emit structured `tracing` events directly (instead of the
# legacy `eprintln!("…")` lines). `sy-core::obs::init` installs the
# subscriber stack; this dep gives the binary the `info!`/`warn!`/
# `error!` macros at every call site.
tracing.workspace = true
crossbeam-channel.workspace = true
futures-util.workspace = true
ulid.workspace = true
rustix.workspace = true
# arch-agent-sandbox Step 3: in-process Landlock + seccomp + env scrub
# sandbox layers (SPEC §4.4 step 3). `landlock` builds the FS/TCP
# ruleset; `seccompiler` compiles the syscall deny set. Both are
# applied in the child between `fork(2)` and `execve(2)` via
# `CommandExt::pre_exec` (see `src/agt/sandbox/exec.rs`).
landlock.workspace = true
seccompiler.workspace = true
# arch-observability Step 7: scheduler.rs + supervisor/mod.rs emit
# `sy_workload_*` / `sy_queue_depth` / `sy_models_warm` via the
# `metrics` facade. No recorder is installed in production (Zone 6.2
# UDS prometheus exporter is deferred); emissions are cheap no-ops
# until then.
metrics.workspace = true
# arch-agent-sandbox Step 5 (SPEC §4.4 "Audit log"): dual-sink audit
# log. `libsystemd::logging::journal_send` lands the structured `SY_*`
# fields in journald; `zstd::stream::copy_encode` compresses the
# 64 MiB rotated `audit.jsonl.1` archives.
libsystemd.workspace = true
zstd.workspace = true
# arch-supervision Step 4: each daemon calls `sy_core::notify::ready()`
# after its listener bind so `Type=notify` units enter `active (running)`
# instead of staying `activating`. The dep is workspace-pinned; the
# call sites live in `src/knowledge/daemon.rs`, `src/agt/daemon.rs`,
# and `src/stack/bar/app.rs`.
sd-notify.workspace = true
# sy-power Step 5: `intent::logind` watcher subscribes to systemd-logind's
# inhibitor list over the system bus and emits `IntentEvent::CallActive`
# when Teams / Slack / Zoom / Discord hold `Inhibit("idle")`. The
# `blocking-api` feature gives us `zbus::blocking::Connection`, which
# keeps the channel synchronous (matches Step 4's `PsiChannel`).
zbus.workspace = true
# sy-power Step 7: `intent::cgroup` walks `/proc/<pid>/cgroup` to match
# new processes against an allow-list and emits
# `IntentEvent::ProcessFromAncestor`. The pure-fn parser also runs in
# tests against synthetic cgroup lines, so the bus-less degradation is
# baked in.
procfs.workspace = true
# sy-power Step 24: GRU inference path (SPEC §2 "tract on CPU"),
# hot-reload via `ArcSwap<Model>`, weights round-trip via
# `safetensors` in Step 25.
tract-onnx.workspace = true
arc-swap.workspace = true
safetensors.workspace = true
# sy-power Step 25: burn-ndarray trainer + autodiff. Pure-CPU; the
# trainer runs in the daemon's idle+plugged window (Step 26). The
# ONNX export is hand-emitted via `prost` against `tract_onnx::pb`
# types — SPEC §6's documented fallback to burn's `onnx-export`
# feature. `prost` was previously dev-only (gen_warmup_gru.rs);
# the trainer needs the same encode path at runtime.
burn.workspace = true
burn-ndarray.workspace = true
burn-autodiff.workspace = true
prost.workspace = true
# sy-power Step 34 (SPEC §RV.2): SVG plot rendering for the offline
# `sy power show` PDF. Pure-Rust SVG backend; no font-kit, no
# bitmap_backend, no `image` widening — see the workspace dep comment
# above for the feature-set rationale. The dep is dev-light: the
# daemon never instantiates a `Plot`; only the one-shot
# `sy power show` (Step 36) does, after the metrics extractors of
# Step 33 produce a `ReportMetrics<'_>` bundle.
plotters.workspace = true
# sy-power Step 35: see workspace dep comment for the typst→pdf-writer
# deviation rationale. The dep is one-shot only — the daemon never
# instantiates the report; only `sy power show` does, after the
# Step-33 metric extractors produce a `ReportMetrics<'_>` bundle.
pdf-writer.workspace = true
# sy-power Step P2-2: PDF image-embed path for the Step-34 SVG plots.
# Pure-Rust SVG rasteriser; pulls usvg + tiny-skia (already a plotters
# transitive). See workspace dep comment for the feature-set rationale.
resvg.workspace = true
# sy-power Step P2-2: zlib compression of the DeviceRGB pixel stream
# embedded under PDF `/FlateDecode`. Transitively present via burn /
# png so the dep adds no compile cost.
flate2.workspace = true
# sy-mon Step 12: `sy mon collect` scrapes each plane's UDS
# `metrics.sock`, parses the Prometheus exposition body, and folds
# the samples into `SystemSnapshot`. Used in `src/mon/collect/`
# only; not pulled into `sy-core` (intermediate representation,
# never serialised on the wire).
prometheus-parse.workspace = true
# sy-mon Step 18: in-popup filter overlay. The `/` keybind compiles
# the typed pattern into a `regex::Regex`; per-panel projections
# (currently `view/aiplane.rs`) drop metric labels that don't match.
# Bin-only dep — `sy-core::mon::snapshot` stays regex-free.
regex.workspace = true
# sy-file-manager Step 9: minisign signature verification at install +
# (one-warn) bypass advertisement at spawn. Pure Rust + zero deps;
# see workspace dep block for rationale.
minisign-verify.workspace = true
# sy-file-manager Step 18 (SPEC §3.3 item 5 — freedesktop trash). The
# `fs::trash` module wraps `trash::delete_all`, `trash::os_limited::
# list`, and `trash::os_limited::restore_all` behind `spawn_blocking`
# so `pub async fn trash/list/restore` can drive the sync `trash`
# crate from the daemon's tokio runtime.
trash.workspace = true
# sy-file-manager Step 19 (SPEC §3.3 item 11 — live updates + MIME
# detection ladder). `fs::watch` builds the notify-rs Stream surface
# the iced UI consumes per visible pane; `fs::mime` is the
# extension-first / sniff-fallback `mime_for(path)` the previewer
# routing reads. See the workspace dep block above for rationale.
tree_magic_mini.workspace = true
xdg-mime.workspace = true
# sy-file-manager Step 25 (SPEC §3.3 item 7 — `/` fuzzy filter +
# `:` command palette completion). Drives `src/file/search/filename.rs`
# and the Step 25 commandbar verb-prefix completion.
nucleo.workspace = true
# sy-file-manager Step 26 (SPEC §3.3 item 8 — text/* built-in
# previewer). Optional + gated behind `gui-iced` via the feature
# flag below — `syntect` only feeds `src/file/view/preview/text.rs`,
# which itself requires the iced widget tree. `--no-default-features`
# builds (CLI/MCP only) drop the dep entirely.
syntect = { workspace = true, optional = true }
# sy-file-manager Step 31 (SPEC §3.3 item 15 — bookmarks + XBEL).
# `src/file/bookmarks.rs` round-trips the freedesktop `recently-used.xbel`
# document via `quick-xml`'s `Writer` / `Reader`. Not gated — the
# `--no-default-features` (CLI / MCP-only) builds still want bookmarks
# (the `file.open` IPC op writes to the XBEL log).
quick-xml.workspace = true

# sy-file-manager Step 17 (SPEC §3.2 row 4 — bulk-copy `tokio-uring`
# path). Linux-only target so cross-builds (macOS / Windows / non-Linux
# CI) never even see the dep; the `file-iouring` feature in the
# `[features]` block above is the runtime flip, the target gate keeps
# the dep-graph clean for portable builds. 0.5 is the latest published
# line; SPEC §3.2 row 4 + Step 17 risks note pin to a known-good
# version so workspace Rust upgrades don't drift the API.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5", optional = true }

