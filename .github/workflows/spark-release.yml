name: Spark release

on:
  workflow_dispatch:
  push:
    tags: ["spark-v*"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: aarch64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-auditable,cargo-zigbuild,minisign
      - run: cargo deny --no-default-features --features spark-agent check
      - run: cargo test --no-default-features --features spark-agent
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo auditable zigbuild --release --target aarch64-unknown-linux-gnu --no-default-features --features spark-agent --bin sy
      - name: Build signed-manifest inputs
        run: |
          mkdir -p target/spark-release
          cp target/aarch64-unknown-linux-gnu/release/sy target/spark-release/sy-aarch64
          sha256sum target/spark-release/sy-aarch64 configs/sy/spark/hf-http-fallback.lock configs/sy/spark/recipes/*.toml specs/openapi/sy-spark-control-v1.json > target/spark-release/SHA256SUMS
          cargo metadata --locked --format-version 1 > target/spark-release/cargo-metadata.json
          cargo tree --locked --no-default-features --features spark-agent -e features > target/spark-release/resolved-features.txt
          cargo tree --locked -d > target/spark-release/duplicate-dependencies.txt
          rg -n "unsafe|links =|build =" Cargo.toml Cargo.lock src > target/spark-release/native-unsafe-build-inventory.txt || true
      - name: Sign release inventory
        if: startsWith(github.ref, 'refs/tags/spark-v')
        env:
          SPARK_MINISIGN_SECRET_KEY: ${{ secrets.SPARK_MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.SPARK_MINISIGN_PASSWORD }}
        run: |
          test -n "$SPARK_MINISIGN_SECRET_KEY"
          test -n "$MINISIGN_PASSWORD"
          printf '%s' "$SPARK_MINISIGN_SECRET_KEY" > target/spark-release/release.key
          chmod 600 target/spark-release/release.key
          minisign -Sm target/spark-release/SHA256SUMS -s target/spark-release/release.key
          rm target/spark-release/release.key
      - uses: actions/upload-artifact@v4
        with:
          name: sy-spark-aarch64-${{ github.sha }}
          path: target/spark-release/
          if-no-files-found: error
          retention-days: 30
