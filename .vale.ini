# Vale configuration for sy docs.
#
# Closes rubric row R-CI-02 of specs/docs-audit/AUDIT-full.md.
#
# Runs in advisory mode in CI (vale-action fail_on_error=false). Vale
# treats the Microsoft and Google packs as the canonical voice guides
# for prose; the audit's R-STYLE-01..04 rows reference them directly.
#
# Install locally (Vale CLI is required to run `vale .` and to populate
# the styles directory):
#   curl -sfL https://install.goreleaser.com/github.com/errata-ai/vale.sh | sh -s v3.7.1
#   vale sync
#
# `vale sync` downloads the packages declared under [Packages] into
# StylesPath (./.vale/styles by convention) on first run.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Microsoft, Google

Vocab = sy

# Only check Markdown — rustdoc lives in source comments and is the
# rustdoc toolchain's responsibility (per the documenter skill rule 11).
[*.md]
BasedOnStyles = Vale, Microsoft, Google

# Headings on the project's `specs/`, `AGENTS.md`, and `CLAUDE.md` use
# project-style title case in places; tighten this later if needed.
Microsoft.Headings = NO
Google.Headings = NO

# `sy` is a project name; the Google rule against single-letter
# acronyms fires on it. Suppress.
Google.Acronyms = NO

# Don't lint code fences, inline code, link URLs, or YAML front matter.
# Vale's CSV-style parser splits BlockIgnores entries on `,`, which
# truncates any embedded regex quantifier like `{0,3}`. The escape
# `\,` doesn't help — Vale keeps the backslash literal and the runtime
# regex blows up with "illegal \ at end of pattern". Use the open-
# ended `*` quantifier instead; in CommonMark a fenced code block
# can have at most 3 spaces of indent (4+ flips it to an indented
# code block) so `( *```)` matches the same prefixes as `( {0,3}```)`
# in practice.
BlockIgnores = (?sm)^( *```.+?^ *```\s*$), \
               (?sm)^( *~~~.+?^ *~~~\s*$)

TokenIgnores = (\x60[^\n\x60]+\x60), \
               (\$+[^\n$]+\$+), \
               (\[[^\]]+\]\([^)]+\))
