[package]
name = "sy-plugin-pdk-third-party"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"
description = "Third-party-shaped previewer fixture for the sy-file-manager Step 11 journey E2E. Built outside the sy workspace to prove the PDK works for any cargo project."

# This crate intentionally sits outside the sy workspace (note the
# `[workspace]` block below, which makes it a sibling of `.` so cargo
# doesn't auto-attach to the parent workspace's virtual root). The
# Step 11 journey E2E builds it with `cargo build --manifest-path ...`
# and asserts a third-party author can land a previewer using only
# the PDK as a path-dep.
[workspace]

[dependencies]
# A real third-party author depends on the PDK alone — the PDK
# re-exports the macro's transitive deps (serde_json, tokio, anyhow)
# under `sy_plugin_pdk::__priv::*` so the user's Cargo.toml stays
# minimal. Locking that contract is the whole point of this fixture.
sy-plugin-pdk = { path = "../../../crates/sy-plugin-pdk" }

[[bin]]
name = "sy-plugin-pdk-third-party"
path = "src/main.rs"
